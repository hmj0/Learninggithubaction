name: first_pipeline
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  message:
    timeout-minutes: 5
    runs-on: ubuntu-22.04

    steps:
      - name: recuperation du code
        uses: actions/checkout@v4

      - name: first message
        run: echo "hello world"

      - name: build de l'image
        run: docker build -t mon-image .
      - name: lanement du containers
        run: docker container run -d  --name mon-image   mon-image
      - name: lister les containers actives
        run: docker container ls -a | grep mon-image
      - name: arret du container
        run: docker container stop mon-image